<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karanlık Dert Odası</title>
    <style>
        body { 
            background-color: #121212; 
            color: #e0e0e0; 
            font-family: monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #chat-box { 
            width: 90%; 
            max-width: 500px; 
            height: 400px; 
            border: 1px solid #333; 
            overflow-y: auto; 
            padding: 15px; 
            margin-bottom: 15px; 
            background: #1a1a1a; 
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .message { 
            margin-bottom: 15px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 8px; 
            word-wrap: break-word;
        }
        .meta { 
            font-size: 0.8em; 
            color: #888; 
            font-style: italic;
        }
        .input-area {
            width: 90%;
            max-width: 530px;
            display: flex;
            gap: 10px;
        }
        input { 
            flex-grow: 1; 
            padding: 12px; 
            background: #2a2a2a; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 4px;
        }
        button { 
            padding: 12px 20px; 
            background: #444; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { 
            background: #666; 
        }
    </style>
</head>
<body>
    <h2>🚬 Dert Duvarı</h2>
    <div id="chat-box">
        <div class="message"><span class="meta">Sistem:</span><br>Hoş geldin... Her şeyin anlamsız olduğu bu boşluğa sen de bir şeyler yaz.</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Boşluğa bağır...">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <!-- Firebase V8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Senin gerçek şifrelerin... Umarım o veritabanını test modunda açmışsındır 💀
        const firebaseConfig = {
            apiKey: "AIzaSyBlxF9qsGsJXlfGcnnzQw3TV8BTPSINyGA",
            authDomain: "dert-duvari-9462d.firebaseapp.com",
            databaseURL: "https://dert-duvari-9462d-default-rtdb.firebaseio.com", 
            projectId: "dert-duvari-9462d",
            storageBucket: "dert-duvari-9462d.firebasestorage.app",
            messagingSenderId: "1096717129709",
            appId: "1:1096717129709:web:3abae1c278a46a85e939e4"
        };

        try {
            // Sistemi başlatıyoruz
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            
            // Mesajları dinle ve ekrana bas
            db.ref("mesajlar").on("child_added", function(snapshot) {
                let data = snapshot.val();
                let chatBox = document.getElementById("chat-box");
                chatBox.innerHTML += `<div class='message'><span class='meta'>Anonim Biri:</span><br>${data.text}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        } catch(e) {
            console.error("Yine bir şeyler ters gitti...", e);
            document.getElementById("chat-box").innerHTML += "<div class='message'><span class='meta' style='color:red;'>Uyarı:</span><br>Sistem çöktü brom... Hayat gibi. 💀</div>";
        }

        function sendMessage() {
            let input = document.getElementById("msg-input");
            let text = input.value;
            if(text.trim() === "") return;
            
            try {
                firebase.database().ref("mesajlar").push({ text: text });
            } catch(e) {
                alert("Hayaller Paris, gerçekler veritabanı bağlantı hatası...");
            }
            input.value = "";
        }
    </script>
</body>
</html>
