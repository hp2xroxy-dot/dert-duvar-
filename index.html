<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dert Duvarı - Gelişmiş Admin Paneli</title>
    <style>
        body { 
            background-color: #121212; 
            color: #e0e0e0; 
            font-family: monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .header-bar {
            width: 90%;
            max-width: 530px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        #online-counter {
            font-size: 0.85em;
            color: #00ffcc;
            background: #1a1a1a;
            padding: 4px 8px;
            border: 1px solid #333;
            border-radius: 4px;
        }
        #chat-box { 
            width: 90%; 
            max-width: 500px; 
            height: 360px; 
            border: 1px solid #333; 
            overflow-y: auto; 
            padding: 15px; 
            margin-bottom: 10px; 
            background: #1a1a1a; 
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .message { 
            margin-bottom: 15px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 8px; 
            word-wrap: break-word;
        }
        .meta { 
            font-size: 0.9em; 
            font-weight: bold;
        }
        .nickname-tag {
            font-size: 0.8em;
            color: #888;
            font-weight: normal;
            margin-left: 5px;
        }
        @keyframes rgbGlow {
            0% { color: #ff0000; }
            33% { color: #00ff00; }
            66% { color: #0000ff; }
            100% { color: #ff0000; }
        }
        .admin-name {
            animation: rgbGlow 3s infinite;
            font-weight: bold;
        }
        .input-area {
            width: 90%;
            max-width: 530px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        input[type="text"] { 
            flex-grow: 1; 
            padding: 10px; 
            background: #2a2a2a; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 4px;
        }
        input[type="file"] {
            display: none;
        }
        .file-upload-btn {
            padding: 10px 12px;
            background: #333;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .file-upload-btn:hover {
            background: #444;
        }
        button { 
            padding: 10px 16px; 
            background: #444; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { 
            background: #666; 
        }
        .admin-panel {
            width: 90%;
            max-width: 530px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .clear-btn {
            background: #721c24;
            font-size: 0.85em;
            padding: 6px 12px;
        }
        .clear-btn:hover {
            background: #a71d2a;
        }
        .admin-controls {
            margin-top: 5px;
            font-size: 0.75em;
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .admin-controls button {
            padding: 2px 6px;
            font-size: 0.8em;
            background: #552222;
        }
        .admin-controls button.unmute {
            background: #225522;
        }
        .admin-controls input {
            padding: 2px 5px;
            font-size: 0.8em;
            width: 90px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
        }
        .msg-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <h2>🚬 Dert Duvarı</h2>
        <div id="online-counter">Online: 1</div>
    </div>

    <!-- Sadece Adminin göreceği yönetim paneli -->
    <div id="admin-panel-container" class="admin-panel" style="display:none;">
        <span style="font-size: 0.85em; color: #00ffcc;">👑 Admin Paneli Aktif</span>
        <button class="clear-btn" onclick="clearChat()">Sohbeti Temizle 🗑️</button>
    </div>

    <div id="chat-box">
        <div class="message"><span class="meta" style="color: #888;">Sistem:</span><br>Gelişmiş versiyon yüklendi. Bekliyoruz...</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Boşluğa bağır..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <label for="img-input" class="file-upload-btn" title="Resim Yükle">📷 Resim</label>
        <input type="file" id="img-input" accept="image/*" onchange="previewImage(this)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
    <div id="image-preview-info" style="font-size: 0.75em; color: #aaa; width: 90%; max-width: 530px; margin-top: 3px;"></div>

    <!-- Firebase V8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBlxF9qsGsJXlfGcnnzQw3TV8BTPSINyGA",
            authDomain: "dert-duvari-9462d.firebaseapp.com",
            databaseURL: "https://dert-duvari-9462d-default-rtdb.firebaseio.com", 
            projectId: "dert-duvari-9462d",
            storageBucket: "dert-duvari-9462d.firebasestorage.app",
            messagingSenderId: "1096717129709",
            appId: "1:1096717129709:web:3abae1c278a46a85e939e4"
        };

        let myId = localStorage.getItem("dert_user_id");
        if(!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("dert_user_id", myId);
        }

        let kullaniciAdi = "Anonim Biri";
        let isAdmin = false;
        let userColor = '#' + Math.floor(Math.random()*16777215).toString(16);
        let selectedImageBase64 = null;

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            
            // Online kullanıcı takibi (Presence sistemi)
            let userStatusRef = db.ref("status/" + myId);
            let connectedRef = db.ref(".info/connected");
            connectedRef.on("value", function(snap) {
                if (snap.val() === true) {
                    userStatusRef.onDisconnect().remove();
                    userStatusRef.set(true);
                }
            });

            db.ref("status").on("value", function(snapshot) {
                let count = snapshot.numChildren();
                document.getElementById("online-counter").innerText = "Online: " + (count > 0 ? count : 1);
            });

            // İsim sorma
            setTimeout(() => {
                let girilenIsim = prompt("Dert duvarına hangi isimle yazacaksın brom?", "");
                if (girilenIsim && girilenIsim.trim() !== "") {
                    let temizIsim = girilenIsim.trim();
                    if (temizIsim.toLowerCase() === "alfred") {
                        kullaniciAdi = "Admin";
                        isAdmin = true;
                        document.getElementById("admin-panel-container").style.display = "flex";
                        alert("Kral merhabası! Admin paneli ve temizleme yetkisi aktif 👑");
                    } else {
                        kullaniciAdi = temizIsim;
                    }
                }
            }, 300);

            // Susturulanlar ve Takma Adlar (Unvanlar)
            db.ref("susturulanlar").on("value", function(snapshot) {
                window.mutedUsers = snapshot.val() || {};
            });

            db.ref("takmaAdlar").on("value", function(snapshot) {
                window.userNicknames = snapshot.val() || {};
            });

            // Sohbeti tamamen silme (Temizle komutu veritabanından mesajları siler)
            db.ref("mesajlar").on("value", function(snapshot) {
                let chatBox = document.getElementById("chat-box");
                if (!snapshot.exists()) {
                    chatBox.innerHTML = `<div class='message'><span class='meta' style='color: #888;'>Sistem:</span><br>Sohbet admin tarafından temizlendi.</div>`;
                    return;
                }
            });

            // Mesajları dinle
            db.ref("mesajlar").on("child_added", function(snapshot) {
                let key = snapshot.key;
                let data = snapshot.val();
                let gonderen = data.isim ? data.isim : "Anonim Biri";
                let renk = data.renk ? data.renk : "#888";
                let senderId = data.senderId || "";
                let image = data.image || null;

                let chatBox = document.getElementById("chat-box");
                
                // Eğer daha önce ilk sistem mesajı varsa temizle
                if(chatBox.children.length === 1 && chatBox.children[0].innerText.includes("Gelişmiş versiyon yüklendi")) {
                    chatBox.innerHTML = "";
                }

                // Özel unvan (Takma ad) kontrolü
                let customTitle = (window.userNicknames && senderId && window.userNicknames[senderId]) ? window.userNicknames[senderId] : "";
                let titleHtml = customTitle ? `<span class="nickname-tag">(${customTitle})</span>` : "";

                let nameHtml = "";
                if (gonderen === "Admin") {
                    nameHtml = `<span class="meta admin-name">Admin</span>`;
                } else {
                    nameHtml = `<span class="meta" style="color: ${renk};">${gonderen}</span>${titleHtml}`;
                }

                let adminControlsHtml = "";
                if (isAdmin && gonderen !== "Admin" && senderId) {
                    let isMuted = window.mutedUsers && window.mutedUsers[senderId];
                    let muteBtnText = isMuted ? "Susturmayı Kaldır" : "Sustur 🔇";
                    let muteBtnClass = isMuted ? "unmute" : "";
                    let currentNick = customTitle ? customTitle : "";

                    adminControlsHtml = `
                        <div class="admin-controls">
                            <button class="${muteBtnClass}" onclick="toggleMute('${senderId}')">${muteBtnText}</button>
                            <input type="text" id="nick-input-${senderId}" placeholder="Unvan ver..." value="${currentNick}">
                            <button onclick="setNickname('${senderId}')">Ata</button>
                        </div>
                    `;
                }

                let imageHtml = image ? `<img src="${image}" class="msg-image" alt="Gönderilen Resim">` : "";

                // Mesaj daha önce eklenmediyse ekle
                if(!document.getElementById(`msg-${key}`)) {
                    chatBox.innerHTML += `<div class='message' id='msg-${key}'>${nameHtml} ${adminControlsHtml}<br>${data.text}${imageHtml}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });

            // Mesaj silindiğinde (Sohbet temizle yapıldığında) ekranı güncelle
            db.ref("mesajlar").on("child_removed", function(snapshot) {
                let key = snapshot.key;
                let el = document.getElementById(`msg-${key}`);
                if(el) el.remove();
            });

        } catch(e) {
            console.error("Hata:", e);
        }

        // Resim seçildiğinde base64 formatına çevir
        function previewImage(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageBase64 = e.target.result;
                    document.getElementById("image-preview-info").innerText = "✔ Resim eklendi (Gönder'e basınca iletilecek)";
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function sendMessage() {
            if (window.mutedUsers && window.mutedUsers[myId]) {
                alert("Boss, admin tarafından susturuldun! Konuşamazsın 🤐");
                return;
            }

            let input = document.getElementById("msg-input");
            let text = input.value;
            if(text.trim() === "" && !selectedImageBase64) return;
            
            try {
                let msgData = { 
                    isim: kullaniciAdi,
                    text: text,
                    renk: userColor,
                    senderId: myId
                };
                if(selectedImageBase64) {
                    msgData.image = selectedImageBase64;
                }

                firebase.database().ref("mesajlar").push(msgData);
            } catch(e) {
                alert("Mesaj gönderilemedi...");
            }

            input.value = "";
            selectedImageBase64 = null;
            document.getElementById("img-input").value = "";
            document.getElementById("image-preview-info").innerText = "";
        }

        // Admin: Sohbeti tamamen temizle
        function clearChat() {
            if(!isAdmin) return;
            if(confirm("Tüm sohbet geçmişi silinecek, emin misin patron?")) {
                firebase.database().ref("mesajlar").remove().then(() => {
                    document.getElementById("chat-box").innerHTML = `<div class='message'><span class='meta' style='color: #888;'>Sistem:</span><br>Sohbet admin tarafından temizlendi.</div>`;
                });
            }
        }

        // Admin: Sustur / Kaldır
        function toggleMute(targetId) {
            if(!isAdmin) return;
            let isMuted = window.mutedUsers && window.mutedUsers[targetId];
            if (isMuted) {
                firebase.database().ref("susturulanlar/" + targetId).remove();
                alert("Susturma kaldırıldı 🔊");
            } else {
                firebase.database().ref("susturulanlar/" + targetId).set(true);
                alert("Kullanıcı susturuldu 🔇");
            }
        }

        // Admin: Kullanıcıya takma ad / unvan verme
        function setNickname(targetId) {
            if(!isAdmin) return;
            let inputField = document.getElementById(`nick-input-${targetId}`);
            let newNick = inputField.value.trim();
            if(newNick === "") {
                firebase.database().ref("takmaAdlar/" + targetId).remove();
                alert("Unvan kaldırıldı.");
            } else {
                firebase.database().ref("takmaAdlar/" + targetId).set(newNick);
                alert("Kullanıcıya '" + newNick + "' unvanı atandı!");
            }
        }
    </script>
</body>
</html>
