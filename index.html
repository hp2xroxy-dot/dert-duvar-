<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dert Duvarı - Admin Paneli</title>
    <style>
        body { 
            background-color: #121212; 
            color: #e0e0e0; 
            font-family: monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #chat-box { 
            width: 90%; 
            max-width: 500px; 
            height: 400px; 
            border: 1px solid #333; 
            overflow-y: auto; 
            padding: 15px; 
            margin-bottom: 15px; 
            background: #1a1a1a; 
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .message { 
            margin-bottom: 15px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 8px; 
            word-wrap: break-word;
        }
        .meta { 
            font-size: 0.9em; 
            font-weight: bold;
        }
        @keyframes rgbGlow {
            0% { color: #ff0000; }
            33% { color: #00ff00; }
            66% { color: #0000ff; }
            100% { color: #ff0000; }
        }
        .admin-name {
            animation: rgbGlow 3s infinite;
            font-weight: bold;
        }
        .input-area {
            width: 90%;
            max-width: 530px;
            display: flex;
            gap: 10px;
        }
        input { 
            flex-grow: 1; 
            padding: 12px; 
            background: #2a2a2a; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 4px;
        }
        button { 
            padding: 12px 20px; 
            background: #444; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { 
            background: #666; 
        }
        .admin-controls {
            margin-top: 5px;
            font-size: 0.75em;
        }
        .admin-controls button {
            padding: 2px 6px;
            font-size: 0.8em;
            background: #552222;
            margin-left: 5px;
        }
        .admin-controls button.unmute {
            background: #225522;
        }
    </style>
</head>
<body>
    <h2>🚬 Dert Duvarı</h2>
    <div id="chat-box">
        <div class="message"><span class="meta" style="color: #888;">Sistem:</span><br>Sistem sıfırlandı, tertemiz kuruldu. Bekliyoruz...</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Boşluğa bağır...">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <!-- Firebase V8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBlxF9qsGsJXlfGcnnzQw3TV8BTPSINyGA",
            authDomain: "dert-duvari-9462d.firebaseapp.com",
            databaseURL: "https://dert-duvari-9462d-default-rtdb.firebaseio.com", 
            projectId: "dert-duvari-9462d",
            storageBucket: "dert-duvari-9462d.firebasestorage.app",
            messagingSenderId: "1096717129709",
            appId: "1:1096717129709:web:3abae1c278a46a85e939e4"
        };

        // Benzersiz kullanıcı ID'si oluştur (Susturma işlemleri için şart)
        let myId = localStorage.getItem("dert_user_id");
        if(!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("dert_user_id", myId);
        }

        let kullaniciAdi = "Anonim Biri";
        let isAdmin = false;
        // Her kullanıcıya rastgele bir renk veriyoruz (Admin hariç)
        let userColor = '#' + Math.floor(Math.random()*16777215).toString(16);

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            
            // Site açılır açılmaz isim soralım
            setTimeout(() => {
                let girilenIsim = prompt("Dert duvarına hangi isimle yazacaksın brom?", "");
                if (girilenIsim && girilenIsim.trim() !== "") {
                    let temizIsim = girilenIsim.trim();
                    if (temizIsim.toLowerCase() === "alfred") {
                        kullaniciAdi = "Admin";
                        isAdmin = true;
                        alert("Kral merhabası! Admin yetkileri aktif 👑");
                    } else {
                        kullaniciAdi = temizIsim;
                    }
                }
            }, 300);

            // Susturulanları dinle
            db.ref("susturulanlar").on("value", function(snapshot) {
                window.mutedUsers = snapshot.val() || {};
            });

            // Mesajları dinle ve ekrana yaz
            db.ref("mesajlar").on("child_added", function(snapshot) {
                let key = snapshot.key;
                let data = snapshot.val();
                let gonderen = data.isim ? data.isim : "Anonim Biri";
                let renk = data.renk ? data.renk : "#888";
                let senderId = data.senderId || "";

                let chatBox = document.getElementById("chat-box");
                
                let nameHtml = "";
                if (gonderen === "Admin") {
                    nameHtml = `<span class="meta admin-name">Admin</span>`;
                } else {
                    nameHtml = `<span class="meta" style="color: ${renk};">${gonderen}</span>`;
                }

                let adminButtons = "";
                // Eğer sen adminse ve mesaj atan başka biriyse sustur butonu koy
                if (isAdmin && gonderen !== "Admin" && senderId) {
                    let isMuted = window.mutedUsers && window.mutedUsers[senderId];
                    if (isMuted) {
                        adminButtons = `<span class="admin-controls"><button class="unmute" onclick="unmuteUser('${senderId}')">Susturmayı Kaldır</button></span>`;
                    } else {
                        adminButtons = `<span class="admin-controls"><button onclick="muteUser('${senderId}', '${gonderen}')">Sustur 🔇</button></span>`;
                    }
                }

                chatBox.innerHTML += `<div class='message' id='msg-${key}'>${nameHtml} ${adminButtons}<br>${data.text}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });

        } catch(e) {
            console.error("Hata:", e);
        }

        function sendMessage() {
            // Susturulmuş mu kontrol et
            if (window.mutedUsers && window.mutedUsers[myId]) {
                alert("Boss, admin tarafından susturuldun! Konuşamazsın 🤐");
                return;
            }

            let input = document.getElementById("msg-input");
            let text = input.value;
            if(text.trim() === "") return;
            
            try {
                firebase.database().ref("mesajlar").push({ 
                    isim: kullaniciAdi,
                    text: text,
                    renk: userColor,
                    senderId: myId
                });
            } catch(e) {
                alert("Mesaj gönderilemedi...");
            }
            input.value = "";
        }

        function muteUser(targetId, targetName) {
            if(!isAdmin) return;
            firebase.database().ref("susturulanlar/" + targetId).set(true);
            alert(targetName + " susturuldu 🔇");
        }

        function unmuteUser(targetId) {
            if(!isAdmin) return;
            firebase.database().ref("susturulanlar/" + targetId).remove();
            alert("Susturma kaldırıldı 🔊");
        }
    </script>
</body>
</html>
